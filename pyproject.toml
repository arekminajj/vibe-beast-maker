[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hevy-fitatu-sync"
version = "0.2.0"
description = "Hevy workouts and the Fitatu food diary together: an MCP server for AI agents to analyze training and nutrition, and a sync that logs workouts in Fitatu."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fitatu-api>=0.6",
  "requests>=2.31",
]
keywords = ["hevy", "fitatu", "workout", "calories", "sync", "mcp", "nutrition"]

[project.optional-dependencies]
mcp = ["fitatu-api[mcp]>=0.6"]
dev = ["pytest>=8", "ruff>=0.6", "fitatu-api[mcp]>=0.6"]

[project.scripts]
hevy-fitatu-sync = "hevy_fitatu_sync.cli:main"
hevy-fitatu-mcp = "hevy_fitatu_sync.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hevy_fitatu_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
